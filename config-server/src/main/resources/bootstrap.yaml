server:
  port: ${CONFIG_SERV_PORT:9000}

spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_SERV_URI:https://github.com/RobinUnfv/session4.git}
          clone-on-start: true
          refresh-rate: 10
          default-label: ${CONFIG_SERV_BRANCH:develop}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka