server:
  port: ${DISC_SERV_PORT:8761}

spring:
  application:
    name: discovery-server
  config:
    activate:
      on-profile: ${DISC_SERV_PROFILE:server01}

eureka:
  client:
    fetch-registry: false
    register-with-eureka: false
  datacenter: Robinzon
  environment: Development
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-expiration-duration-in-seconds: 30